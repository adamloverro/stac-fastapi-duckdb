services:
  app-duckdb:
    container_name: stac-fastapi-duckdb
    image: stac-utils/stac-fastapi-duckdb
    restart: always
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8084
      - RELOAD=true
      - ENVIRONMENT=local
      - WEB_CONCURRENCY=10
      - STAC_FILE_PATH=/app/stac_collections
      - BACKEND=duckdb
      - PARQUET_URLS_JSON=${PARQUET_URLS_JSON}
      # Azure Storage Configuration
      - STAC_STORAGE_STORAGE_TYPE=${STAC_STORAGE_STORAGE_TYPE}
      - STAC_STORAGE_AZURE_ACCOUNT_NAME=${STAC_STORAGE_AZURE_ACCOUNT_NAME}
      - STAC_STORAGE_AZURE_CONTAINER_NAME=${STAC_STORAGE_AZURE_CONTAINER_NAME}
      - STAC_STORAGE_AZURE_AUTHENTICATION=${STAC_STORAGE_AZURE_AUTHENTICATION}
      - STAC_STORAGE_AZURE_MANAGED_IDENTITY_CLIENT_ID=${STAC_STORAGE_AZURE_MANAGED_IDENTITY_CLIENT_ID}
      - STAC_STORAGE_AZURE_SAS_TOKEN=${STAC_STORAGE_AZURE_SAS_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL}
    ports:
      - "8085:8084"
    volumes:
      - ./stac_collections:/app/stac_collections
      - ./stac_fastapi:/app/stac_fastapi
      - ./tests:/app/tests
    command:
      bash -c "python -m stac_fastapi.duckdb.app"