name: stac-fastapi-duckdb

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - features/**

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12"]

    name: Python ${{ matrix.python-version }} testing with DuckDB

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint code
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files

      - name: Build Docker image
        run: |
          docker compose build
        env:
          STAC_FILE_PATH: "${{ github.workspace }}/stac_collections"
          PARQUET_URLS_JSON: '{"io-lulc-9-class":"file:///app/stac_collections/io-lulc-9-class/io-lulc-9-class.parquet"}'
          # Azure Storage Configuration (optional for CI, defaults to local storage)
          STAC_STORAGE_STORAGE_TYPE: "local"
          STAC_STORAGE_AZURE_ACCOUNT_NAME: ""
          STAC_STORAGE_AZURE_CONTAINER_NAME: ""
          STAC_STORAGE_AZURE_AUTHENTICATION: ""
          STAC_STORAGE_AZURE_MANAGED_IDENTITY_CLIENT_ID: ""
          STAC_STORAGE_AZURE_SAS_TOKEN: ""
          LOG_LEVEL: "INFO"

      - name: Run test suite in Docker
        run: |
          docker compose run --rm app-duckdb pytest tests/ -v --timeout=300 -m "not integration"
        env:
          ENVIRONMENT: testing
          STAC_FILE_PATH: "${{ github.workspace }}/stac_collections"
          PARQUET_URLS_JSON: '{"io-lulc-9-class":"file:///app/stac_collections/io-lulc-9-class/io-lulc-9-class.parquet"}'
          # Azure Storage Configuration (optional for CI, defaults to local storage)
          STAC_STORAGE_STORAGE_TYPE: ""
          STAC_STORAGE_AZURE_ACCOUNT_NAME: ""
          STAC_STORAGE_AZURE_CONTAINER_NAME: ""
          STAC_STORAGE_AZURE_AUTHENTICATION: ""
          STAC_STORAGE_AZURE_MANAGED_IDENTITY_CLIENT_ID: ""
          STAC_STORAGE_AZURE_SAS_TOKEN: ""
          LOG_LEVEL: "INFO"
